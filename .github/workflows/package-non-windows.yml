name: Package non-Windows

on:
  workflow_dispatch:

concurrency:
  group: package-non-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            script: dist:mac:x64
          - arch: arm64
            runner: macos-latest
            script: dist:mac:arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build package
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-desktop-macos-${{ matrix.arch }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.yml
            dist-electron/*.yaml
            dist-electron/*.blockmap
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build package
        run: npm run dist:linux -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-desktop-linux-x64
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.yml
            dist-electron/*.yaml
            dist-electron/*.blockmap
          if-no-files-found: error
          retention-days: 14
